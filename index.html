  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2Fspan>\n            <span style=\"{{ a.verStyle }}\">Ver<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ semNotificacoes }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border:1px dashed var(--line,rgba(0,0,0,.16));border-radius:14px;padding:30px;text-align:center;font:400 12px/1.4 'Public Sans';color:var(--dim,#8b857e)\">Nada pendente. Tudo em dia.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ exp }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:68;{{ overlayCenter }}\">\n    <div data-jk-sheet=\"1\" style=\"{{ modalStyle }}\">\n      <span style=\"font:800 17px/1.1 Archivo;color:var(--text,#231f1c)\">Exportar<\u002Fspan>\n      <div style=\"display:flex;gap:7px\">\n        <sc-for list=\"{{ exp.escopos }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ s.on }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ exp.pdf }}\" style=\"display:flex;align-items:center;gap:12px;padding:15px;border-radius:14px;border:1px solid var(--line,rgba(0,0,0,.09));background:var(--card,#fff);cursor:pointer;text-align:left\">\n        <span style=\"width:38px;height:38px;border-radius:11px;background:#8A2B06;color:#fff;display:flex;align-items:center;justify-content:center;font:700 11px/1 Archivo;flex:none\">PDF<\u002Fspan>\n        <span style=\"display:flex;flex-direction:column;gap:2px\">\n          <span style=\"font:700 13.5px/1 Archivo;color:var(--text,#231f1c)\">Relatório PDF<\u002Fspan>\n          <span style=\"font:400 11.5px/1.2 'Public Sans';color:var(--dim,#8b857e)\">Ordens, recebimentos e saídas do período<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fbutton>\n      <button sc-camel-on-click=\"{{ exp.csv }}\" style=\"display:flex;align-items:center;gap:12px;padding:15px;border-radius:14px;border:1px solid var(--line,rgba(0,0,0,.09));background:var(--card,#fff);cursor:pointer;text-align:left\">\n        <span style=\"width:38px;height:38px;border-radius:11px;background:#1B7A85;color:#fff;display:flex;align-items:center;justify-content:center;font:700 11px/1 Archivo;flex:none\">XLS<\u002Fspan>\n        <span style=\"display:flex;flex-direction:column;gap:2px\">\n          <span style=\"font:700 13.5px/1 Archivo;color:var(--text,#231f1c)\">Planilha .csv<\u002Fspan>\n          <span style=\"font:400 11.5px/1.2 'Public Sans';color:var(--dim,#8b857e)\">Todas as colunas para Excel<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fbutton>\n      <button sc-camel-on-click=\"{{ exp.fechar }}\" style=\"height:46px;border-radius:13px;border:1px solid var(--line,rgba(0,0,0,.12));background:var(--card,#fff);color:var(--text,#231f1c);font:700 13px/1 Archivo;cursor:pointer\">Fechar<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ cfg }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:74;{{ overlayTail }}\">\n    <div data-jk-sheet=\"1\" style=\"{{ sheetStyle }}\">\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <span style=\"flex:1;font:800 18px/1.1 Archivo;color:var(--text,#231f1c)\">Configurações<\u002Fspan>\n        <button sc-camel-on-click=\"{{ cfg.fechar }}\" style=\"width:38px;height:38px;border-radius:12px;border:1px solid var(--line,rgba(0,0,0,.12));background:var(--card,#fff);color:var(--dim,#8b857e);font:700 16px/1 Archivo;cursor:pointer\">×<\u002Fbutton>\n      <\u002Fdiv>\n\n      <span style=\"font:700 11px/1 Archivo;letter-spacing:.5px;color:var(--dim,#8b857e);text-transform:uppercase\">Empresa<\u002Fspan>\n      <input value=\"{{ cfg.empresa }}\" sc-camel-on-change=\"{{ cfg.setEmpresa }}\" placeholder=\"Nome fantasia\" style=\"{{ ui.inp }}\">\n      <input value=\"{{ cfg.razao }}\" sc-camel-on-change=\"{{ cfg.setRazao }}\" placeholder=\"Razão social (sai nos documentos)\" style=\"{{ ui.inp }}\">\n      <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n        <input value=\"{{ cfg.cnpj }}\" sc-camel-on-change=\"{{ cfg.setCnpj }}\" placeholder=\"CNPJ\" style=\"{{ cfg.inpHalf }}\">\n        <input value=\"{{ cfg.fone }}\" sc-camel-on-change=\"{{ cfg.setFone }}\" placeholder=\"Telefone\" style=\"{{ cfg.inpHalf }}\">\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n        <input value=\"{{ cfg.pix }}\" sc-camel-on-change=\"{{ cfg.setPix }}\" placeholder=\"Chave Pix\" style=\"{{ cfg.inpHalf }}\">\n        <input value=\"{{ cfg.favorecido }}\" sc-camel-on-change=\"{{ cfg.setFavorecido }}\" placeholder=\"Favorecido do Pix\" style=\"{{ cfg.inpHalf }}\">\n      <\u002Fdiv>\n      <input value=\"{{ cfg.usuario }}\" sc-camel-on-change=\"{{ cfg.setUsuario }}\" placeholder=\"Seu nome (registrado na timeline)\" style=\"{{ ui.inp }}\">\n\n      <span style=\"font:700 11px/1 Archivo;letter-spacing:.5px;color:var(--dim,#8b857e);text-transform:uppercase;margin-top:6px\">Financeiro<\u002Fspan>\n      <span style=\"font:400 11.5px/1.4 'Public Sans';color:var(--dim,#8b857e)\">Saldo inicial do caixa — o saldo atual é calculado como saldo inicial + entradas − saídas.<\u002Fspan>\n      <input value=\"{{ cfg.saldoInicial }}\" sc-camel-on-change=\"{{ cfg.setSaldo }}\" inputmode=\"decimal\" placeholder=\"0,00\" style=\"{{ ui.inp }}\">\n\n      <span style=\"font:700 11px/1 Archivo;letter-spacing:.5px;color:var(--dim,#8b857e);text-transform:uppercase;margin-top:6px\">Aparência<\u002Fspan>\n      <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n        <sc-for list=\"{{ cfg.temas }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ t.on }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <span style=\"font:700 11px/1 Archivo;letter-spacing:.5px;color:var(--dim,#8b857e);text-transform:uppercase;margin-top:6px\">Sincronização com o celular<\u002Fspan>\n      <div style=\"display:flex;align-items:center;gap:9px;background:var(--card,#fff);border:1px solid var(--line,rgba(0,0,0,.08));border-radius:13px;padding:13px 14px\">\n        <span style=\"{{ cfg.syncPontoStyle }}\"><\u002Fspan>\n        <span style=\"{{ cfg.syncTxtStyle }}\">{{ cfg.syncTxt }}<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font:400 11.5px/1.45 'Public Sans';color:var(--dim,#8b857e)\">{{ cfg.syncDetalhe }}<\u002Fspan>\n      <span style=\"{{ cfg.syncPendStyle }}\">{{ cfg.syncPend }}<\u002Fspan>\n      <span style=\"{{ cfg.syncErroStyle }}\">{{ cfg.syncErro }}<\u002Fspan>\n      <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n        <button sc-camel-on-click=\"{{ cfg.agora }}\" style=\"flex:1;min-width:150px;height:44px;border-radius:13px;border:none;background:var(--ink,#231f1c);color:var(--on-ink,#fff);font:700 12.5px/1 Archivo;cursor:pointer\">Sincronizar agora<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ cfg.toggleSync }}\" style=\"{{ cfg.toggleStyle }}\">{{ cfg.toggleLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ cfg.testar }}\" style=\"flex:1;min-width:150px;height:44px;border-radius:13px;border:1px solid var(--line,rgba(0,0,0,.12));background:var(--card,#fff);color:var(--text,#231f1c);font:700 12.5px/1 Archivo;cursor:pointer\">Testar conexão<\u002Fbutton>\n      <\u002Fdiv>\n      <span style=\"{{ cfg.statusStyle }}\">{{ cfg.statusMsg }}<\u002Fspan>\n\n      <span style=\"font:700 11px/1 Archivo;letter-spacing:.5px;color:var(--dim,#8b857e);text-transform:uppercase;margin-top:6px\">Dados<\u002Fspan>\n      <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n        <button sc-camel-on-click=\"{{ cfg.backup }}\" style=\"flex:1;min-width:140px;height:44px;border-radius:13px;border:1px solid var(--line,rgba(0,0,0,.12));background:var(--card,#fff);color:var(--text,#231f1c);font:700 12.5px/1 Archivo;cursor:pointer\">Baixar backup (.json)<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ cfg.fechar }}\" style=\"flex:1;min-width:140px;height:44px;border-radius:13px;border:none;background:#8ee600;color:#1d3800;font:800 12.5px/1 Archivo;cursor:pointer\">Concluir<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;bottom:120px;left:0;right:0;display:flex;justify-content:center;z-index:80;pointer-events:none\">\n    <span style=\"background:var(--ink,#231f1c);color:var(--on-ink,#fff);font:600 12px/1 'Public Sans';padding:12px 18px;border-radius:11px;box-shadow:0 8px 24px rgba(0,0,0,.25)\">{{ toast }}<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;tema&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;claro&quot;,&quot;escuro&quot;,&quot;jakero&quot;],&quot;default&quot;:&quot;claro&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Aparência&quot;},&quot;mostrarValores&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Quadro de produção&quot;},&quot;densidade&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;confortavel&quot;,&quot;compacta&quot;],&quot;default&quot;:&quot;confortavel&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Aparência&quot;}}\">\nconst KEY='jakero_os_v3', KEY2='jakero_os_v4', CKEY='jakero_config_v1', CKEY2='jakero_config_v2', SKEY='jakero_saidas_v1', STKEY='jakero_storage_v1';\nconst MESC=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];\nconst MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];\nconst iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+St '},\n        {k:'Serviço', v:f.servico||'—'}, {k:'Categoria', v:f.categoria||'—'},\n        {k:'Itens', v: listaItens.length > 1 ? listaItens.map((it,i)=>(i+1)+'. '+it.servico+' — '+brl(valorItem(it))).join(' · ') : qtdStr(num(f.qtd))+' × '+brl(num(f.unit))},\n        {k:'Desconto', v:brl(listaItens.reduce((a,it)=>a+num(it.desconto),0))}, {k:'Total', v:brl(total)},\n        {k:'Entrada', v:brl(num(f.entrada))}, {k:'Pagamento', v:f.parcelado ? n+'× '+(f.freq||'mensal') : 'à vista'},\n        {k:'Previsão de entrega', v:br(f.entregaPrev)}, {k:'Arquivos', v:String((f.arquivos||[]).length)}\n      ],\n      anterior: () => step === 0 ? this.setState({sheet:false}) : this.setState({step:step-1}),\n      anteriorStyle: 'flex:1;height:50px;border-radius:14px;border:1px solid var(--line,rgba(0,0,0,.12));background:var(--card,#fff);color:var(--text,#231f1c);font:700 13px/1 Archivo;cursor:pointer',\n      proximo: () => step === 5 ? this.salvarWizard() : this.setState({step:step+1}),\n      proximoLabel: step === 5 ? (S.editId ? 'Salvar alterações' : 'Criar ordem de serviço') : 'Continuar',\n      fechar: () => this.setState({sheet:false})\n    };\n  }\n  valsItem(S){\n    if (!S.itemOs) return null;\n    const wizard = S.itemOs === '__novo__';\n    const e = wizard ? null : this.byId(S.itemOs);\n    if (!wizard && !e) return null;\n    const lista = wizard ? this.itensForm() : itensOf(e);\n    const f = S.itemForm, p = patch => this.setState({itemForm: Object.assign({}, f, patch)});\n    const total = Math.max(0, num(f.qtd)*num(f.unit) - num(f.desconto));\n    const outros = lista.filter((_,i)=>i !== S.itemIdx).reduce((a,it)=>a+valorItem(it), 0);\n    return {\n      titulo: S.itemIdx == null ? 'Adicionar item' : 'Alterar item',\n      info: wizard ? 'Nova ordem de serviço' : ('OS '+String(e.num).padStart(6,'0')+' · '+e.cliente),\n      servico:f.servico, qtd:f.qtd, unit:f.unit, desconto:f.desconto,\n      setServico: ev => p({servico:ev.target.value}),\n      setQtd: ev => p({qtd:ev.target.value}),\n      setUnit: ev => p({unit:ev.target.value}),\n      setDesconto: ev => p({desconto:ev.target.value}),\n      subtotal: brl(total),\n      novoTotal: 'Total da ordem: '+brl(outros + total),\n      salvar: this.salvaItem,\n      fechar: () => this.setState({itemOs:null, itemIdx:null})\n    };\n  }\n  valsPay(S){\n    const e = S.payId ? this.byId(S.payId) : null;\n    if (!e) return null;\n    return {\n      info: e.cliente+' · OS '+String(e.num).padStart(6,'0')+' · saldo de '+brl(faltaOf(e)),\n      data: S.payForm.data, valor: S.payForm.valor,\n      setData: ev => this.setState({payForm: Object.assign({}, S.payForm, {data:ev.target.value})}),\n      setValor: ev => this.setState({payForm: Object.assign({}, S.payForm, {valor:ev.target.value})}),\n      salvar: this.savePay, fechar: () => this.setState({payId:null})\n    };\n  }\n  valsSaida(S, chip){\n    if (!S.saidaSheet) return null;\n    const f = S.saidaForm, p = patch => this.setState({saidaForm: Object.assign({}, f, patch)});\n    return {\n      descricao:f.descricao, valor:f.valor, vencimento:f.vencimento,\n      setDescricao: ev => p({descricao:ev.target.value}),\n      setValor: ev => p({valor:ev.target.value}),\n      setVencimento: ev => p({vencimento:ev.target.value}),\n      categorias: CAT_SAIDA.map(c=>({label:c, on:()=>p({categoria:c}), style:chip(f.categoria===c)})),\n      formas: ['Pix','Dinheiro','Cartão','Boleto','Transferência'].map(x=>({label:x, on:()=>p({forma:x}), style:chip(f.forma===x)})),\n      pagoLabel: f.pago ? 'Já foi paga — entra no caixa de hoje' : 'Ainda não paga — vai para contas a pagar',\n      pagoStyle: 'height:46px;border-radius:13px;border:1px solid '+(f.pago?'transparent':'var(--line,rgba(0,0,0,.12))')+';background:'+(f.pago?'#dff3b8':'var(--card,#fff)')+';color:'+(f.pago?'#2c5200':'var(--dim,#8b857e)')+\";font:700 12px/1 Archivo;cursor:pointer\",\n      togglePago: () => p({pago: !f.pago}),\n      salvar: this.saveSaida, fechar: () => this.setState({saidaSheet:false})\n    };\n  }\n  valsZap(S, chip){\n    const e = S.zapId ? this.byId(S.zapId) : null;\n    if (!e) return null;\n    const set = m => this.setState({zapMsg:m});\n    const am = (e.amostras||[]).filter(a=>a.token).slice(-1)[0];\n    return {\n      info: e.cliente+' · '+(e.telefone || 'sem telefone cadastrado'),\n      msg: S.zapMsg,\n      setMsg: ev => this.setState({zapMsg: ev.target.value}),\n      modelos: [\n        {l:'Nova OS', m:MODELOS.nova(e)}, {l:'Em produção', m:MODELOS.producao(e)},\n        {l:'Amostra', m: am ? MODELOS.amostra(e, this.linkAmostra(am)) : MODELOS.amostra(e, '(envie uma amostra primeiro)')},\n        {l:'Pronto', m:MODELOS.pronto(e)}, {l:'Aprovada', m:MODELOS.aprovada(e)},\n        {l:'Cobrança', m:MODELOS.atrasado(e, faltaOf(e), e.vencimento||e.entregaPrev||e.data)}\n      ].map(x=>({label:x.l, on:()=>set(x.m), style:chip(S.zapMsg===x.m)})),\n      enviar: () => this.enviarZap(e, S.zapMsg),\n      fechar: () => this.setState({zapId:null})\n    };\n  }\n  valsCliente(S, cardOS){\n    if (!S.cliId) return null;\n    const c = this.clientesLista().filter(x=>x.nome===S.cliId)[0];\n    if (!c) return null;\n    const falta = c.total - c.pago;\n    return {\n      nome:c.nome, contato: [c.telefone, c.email].filter(Boolean).join(' · ') || 'sem contato cadastrado',\n      numeros: [\n        {k:'Total comprado', v:brl(c.total), style:'font:800 17px/1 Archivo;color:var(--text,#231f1c);font-variant-numeric:tabular-nums'},\n        {k:'Total pago', v:brl(c.pago), style:'font:800 17px/1 Archivo;color:var(--ok,#2c5200);font-variant-numeric:tabular-nums'},\n        {k:'Saldo', v:brl(falta), style:'font:800 17px/1 Archivo;color:'+(falta>0.005?'var(--danger,#8A2B06)':'var(--text,#231f1c)')+';font-variant-numeric:tabular-nums'},\n        {k:'Ordens', v:String(c.ordens.length), style:'font:800 17px/1 Archivo;color:var(--text,#231f1c)'}\n      ],\n      novaOS: () => { this.openNew(); this.patchForm({cliente:c.nome, telefone:c.telefone||''}); this.setState({cliId:null}); },\n      zap: () => this.enviarZap(c.ordens[c.ordens.length-1], 'Olá, '+primeiro(c.nome)+'!'),\n      ordens: c.ordens.slice().sort((a,b)=>String(b.data).localeCompare(String(a.data))).map(cardOS),\n      voltarLabel: S.tab === 'clientes' ? 'Clientes' : 'Voltar',\n      fechar: () => this.setState({cliId:null})\n    };\n  }\n  valsConfig(S, chip){\n    if (!S.cfg) return null;\n    const c = S.config;\n    const rot = this.rotuloSync();\n    return {\n      empresa:c.empresa, cnpj:c.cnpj, fone:c.fone, usuario:c.usuario, saldoInicial:c.saldoInicial,\n      razao:c.razao||'', pix:c.pix||'', favorecido:c.favorecido||'',\n      setRazao: ev => this.setConfig({razao:ev.target.value}),\n      setPix: ev => this.setConfig({pix:ev.target.value}),\n      setFavorecido: ev => this.setConfig({favorecido:ev.target.value}),\n      inpHalf: \"flex:1 0 auto;min-width:140px;height:48px;border-radius:13px;border:1px solid var(--line,rgba(0,0,0,.12));background:var(--card,#fff);padding:0 13px;font:500 14px/1 'Public Sans';color:var(--text,#231f1c)\",\n      syncTxt: rot.txt,\n      syncTxtStyle: 'font:700 13px/1.3 Archivo;color:'+rot.cor,\n      syncPontoStyle: 'display:block;width:9px;height:9px;border-radius:50%;flex:none;background:'+rot.ponto,\n      syncDetalhe: Nuvem.ligada()\n        ? 'As ordens de serviço são compartilhadas com o aplicativo do celular automaticamente: ao abrir, a cada 45 segundos e sempre que você altera algo.'\n        : 'Enquanto estiver desligada, o que você fizer aqui não vai para o celular. Ao religar, as alterações pendentes são enviadas.',\n      syncPend: this.pendentes() ? pl(this.pendentes(), 'alteração esperando envio', 'alterações esperando envio') : '',\n      syncPendStyle: this.pendentes() ? \"font:600 11.5px/1.4 'Public Sans';color:#7a4a00\" : 'display:none',\n      syncErro: S.syncMsg || '',\n      syncErroStyle: S.syncMsg ? \"font:600 11.5px/1.4 'Public Sans';color:var(--danger,#8A2B06)\" : 'display:none',\n      agora: () => this.sincronizar(false),\n      toggleSync: () => { const novo = !Nuvem.ligada(); Nuvem.savePrefs({ativo:novo}); this.forceUpdate(); if (novo) this.sincronizar(false); else this.setState({syncEstado:''}); },\n      toggleLabel: Nuvem.ligada() ? 'Desligar sincronização' : 'Ligar sincronização',\n      toggleStyle: 'flex:1;min-width:150px;height:44px;border-radius:13px;border:1px solid '+(Nuvem.ligada()?'var(--line,rgba(0,0,0,.12))':'transparent')+';background:'+(Nuvem.ligada()?'var(--card,#fff)':'#8ee600')+';color:'+(Nuvem.ligada()?'var(--text,#231f1c)':'#1d3800')+\";font:700 12.5px/1 Archivo;cursor:pointer\",\n      setEmpresa: ev => this.setConfig({empresa:ev.target.value}),\n      setCnpj: ev => this.setConfig({cnpj:ev.target.value}),\n      setFone: ev => this.setConfig({fone:ev.target.value}),\n      setUsuario: ev => this.setConfig({usuario:ev.target.value}),\n      setSaldo: ev => this.setConfig({saldoInicial:ev.target.value}),\n      temas: TEMAS.map(t=>({label:t.label, on:()=>this.setConfig({tema:t.k}), style:chip(c.tema===t.k)})),\n      testar: async () => { this.setState({cfgStatus:'Verificando…'}); const r = await Nuvem.testar(); this.setState({cfgStatus:r.msg}); },\n      statusMsg: S.cfgStatus || '',\n      statusStyle: S.cfgStatus ? \"font:600 11.5px/1.4 'Public Sans';color:var(--info,#1B7A85)\" : 'display:none',\n      backup: this.backup,\n      fechar: () => this.setState({cfg:false})\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
